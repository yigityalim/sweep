name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    name: Build / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target "${{ matrix.target }}"

      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.1

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Build
        run: cargo build -p sweep-cli --release --locked --target "${{ matrix.target }}"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="sweep-${TAG}-${TARGET}.tar.gz"
          stage="$(mktemp -d)"
          cp "target/${TARGET}/release/sw" "${stage}/sw"
          cp LICENSE README.md "${stage}/"
          tar -C "${stage}" -czf "${archive}" sw LICENSE README.md
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            sweep-*.tar.gz
            sweep-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify tag points at workflow commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          test "$(git rev-list -n 1 "${TAG}")" = "${SHA}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${TAG}"
