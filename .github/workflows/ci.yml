name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  rust:
    name: Rust / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - macos-26-intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Select pinned Rust toolchain
        run: rustup override set 1.98.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Print generated lockfile
        if: matrix.os == 'macos-26'
        run: |
          echo SWEEP_CARGO_LOCK_BEGIN
          base64 < Cargo.lock
          echo SWEEP_CARGO_LOCK_END

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Build release
        run: cargo build --workspace --release --locked
